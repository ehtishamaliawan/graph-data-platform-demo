[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_configs = true
exclude = ["^tests/"]

[[tool.mypy.overrides]]
module = ["neo4j.*"]
ignore_missing_imports = true
